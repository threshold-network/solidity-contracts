name: NPM

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "deploy/**"
      - "hardhat.config.ts"
      - ".nvmrc"
      - "package.json"
      - "tsconfig.json"
      - "tsconfig.export.json"
      - "yarn.lock"
  workflow_dispatch:

jobs:
  npm-compile-publish-contracts:
    runs-on: ubuntu-latest
    env:
      # setup-node's generated npmrc references this during Yarn install and
      # the npm-version-bump action's registry read below. The publish step
      # overrides it with the real registry token.
      NODE_AUTH_TOKEN: unused
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "yarn"

      - name: Install needed dependencies
        run: yarn install --frozen-lockfile

      # Deploy contracts to a local network to generate deployment artifacts that
      # are required by dashboard compilation.
      - name: Deploy contracts
        run: yarn deploy --network hardhat --write true

      - name: Bump up package version
        id: npm-version-bump
        uses: keep-network/npm-version-bump@v2
        with:
          environment: dev
          branch: ${{ github.ref }}
          commit: ${{ github.sha }}

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --network=hardhat --tag=development
